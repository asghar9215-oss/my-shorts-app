name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.playtube.app --project-name playtube_app .
          if [ -f ../pubspec.yaml ]; then cp ../pubspec.yaml ./pubspec.yaml; fi
          if [ -f ../lib/main.dart ]; then cp ../lib/main.dart ./lib/main.dart; fi
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app-release.apk
